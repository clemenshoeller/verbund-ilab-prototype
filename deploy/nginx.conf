# Serves the built single-page app. Listens on 8080 so it runs without root (OpenShift).

# index.html must always be fetched fresh, because it names the current asset files.
# Files in /assets carry a content hash in their name and can be cached for long.
map $uri $cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Basic browser protections. The app loads nothing from other origins.
    # Inline styles are allowed because the app sets bar widths with style attributes.
    # All headers are set here and in no location block, so every response carries them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    # Used by the platform to see whether the container is up.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
